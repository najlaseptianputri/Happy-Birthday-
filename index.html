<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--vh:1vh;--u:min(1vw,calc(var(--vh)*1.7778));--pink:#f7a8c9;--ink:#3b2a4a;--cream:#fff6e5;--accent:#ff6f91;--wood:#c98f5a}
@supports(height:100dvh){:root{--vh:1dvh}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1d38;font-family:'Press Start 2P','Courier New',monospace;color:var(--ink);overflow:hidden}
body{position:fixed;inset:0}
img{image-rendering:pixelated}
button{font-family:inherit;border-radius:8px}

/* ===== STAGE (ruangan) ===== */
#stage{position:absolute;left:50%;top:50%;width:min(100vw,calc(var(--vh)*177.78));aspect-ratio:16/9;transform:translate(-50%,-50%);
  background:linear-gradient(#f7a8c9 0 68%,#8a5a36 68% 69%,var(--wood) 69%);background-size:cover;overflow:hidden}
.obj{position:absolute;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .15s}
.obj:hover{transform:translateY(calc(var(--u)*-.4))}
.obj .ph{font-size:calc(var(--u)*7);line-height:1}
.obj img{width:100%;height:100%;object-fit:contain}
.obj[data-key] .ph,.obj[data-key] .lbl,.gift .ph{visibility:hidden}
.wish-trigger{overflow:hidden;z-index:2}
.wish-trigger:hover{transform:none}
.wish-trigger img{transform:scale(3.5);pointer-events:none}
.gift,.balloon{z-index:1}
.gift img{transform:scale(14);pointer-events:none}
.gift.purple img{transform:scale(16)}
.lbl{font-size:calc(var(--u)*.9);margin-top:calc(var(--u)*.5);background:#fff8;padding:2px 6px}
.gift{cursor:grab}.gift.drag{cursor:grabbing;z-index:20;transform:scale(1.1)}
.gift .ph{font-size:calc(var(--u)*5)}

/* kue + lilin (placeholder CSS) */
#cake .tier{background:#ffe0ef;border:3px solid var(--ink);height:calc(var(--u)*3.5)}
#cake .t1{width:calc(var(--u)*10)}#cake .t2{width:calc(var(--u)*13);background:#ff9ec4}
#cake .candle{width:calc(var(--u)*.9);height:calc(var(--u)*3);background:#fff;border:2px solid var(--ink);position:relative;margin-bottom:-2px}
.flame{position:absolute;left:50%;bottom:100%;margin-left:calc(var(--u)*-.6);width:calc(var(--u)*1.2);height:calc(var(--u)*2.2);
  background:radial-gradient(#fff 10%,#ffe14d 45%,#ff8a00 85%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
  box-shadow:0 0 calc(var(--u)*2) #ffb300;transform-origin:50% 100%;animation:sway .45s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg) scaleY(.92)}to{transform:rotate(8deg) scaleY(1.1)}}
#cake.out .flame{animation:none;background:#6b6b6b;box-shadow:none;height:calc(var(--u)*.7);opacity:.55;border-radius:2px}
#cake.out{cursor:default}
#cake:hover{transform:none}
#cake img.cake-sprite{position:absolute;inset:0;transform:scale(10);pointer-events:none}
#cake img.cake-flame{position:absolute;left:var(--flame-left);top:-7%;width:16%;height:28%;transform:scale(7);pointer-events:none}
#cake.out img.cake-flame{animation:flame-out .4s ease-out forwards}
@keyframes flame-out{to{opacity:0;transform:translateY(-20%) scale(1)}}
#cake.out img.cake-sprite{filter:brightness(.9)}
#cake .candle,#cake .tier{display:none}

/* balon */
.balloon{cursor:pointer}
.bal{
  position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;
  animation:bsway 5s ease-in-out infinite;animation-delay:var(--d,10s);
  will-change: transform;
}

.balloon .bal img{width:100%;height:100%;object-fit:contain;transform:scale(14);pointer-events:none}

.bal .body{display:block;width:72%;aspect-ratio:.82;background:var(--c);border:3px solid var(--ink);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  box-shadow:inset calc(var(--u)*-.5) calc(var(--u)*-.5) 0 #0002,inset calc(var(--u)*.5) calc(var(--u)*.5) 0 #fff6}

.bal .str{display:block;width:3px;flex:1;background:var(--ink);opacity:.6}

@keyframes bsway{
  0%, 100% {
    transform: translateY(0px); /* Posisi awal diam di bawah */
  }
  50% {
    transform: translateY(calc(var(--u)*-1.2));
  }
}

.balloon.pop .bal{animation:none}
.balloon.pop:not(.hasimg) .bal>*{display:none}
.balloon.pop::after{content:'💥';position:absolute;left:50%;top:28%;width:calc(var(--u)*5);height:calc(var(--u)*5);display:grid;place-items:center;font-size:calc(var(--u)*2);line-height:1;animation:burst .45s ease-out forwards;z-index:2}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@keyframes pop-away{to{transform:scale(1.8);opacity:0}}
.balloon.gone{display:none}

/* pesan putar ke landscape */
#rotate{display:none;position:fixed;inset:0;z-index:300;background:var(--ink);color:#fff;place-items:center;text-align:center;padding:24px}
#rotate span{font-size:48px;display:block;margin-bottom:18px;animation:turn 2.4s ease-in-out infinite}
#rotate p{font-size:11px;line-height:1.9;margin:0}
@keyframes turn{0%,30%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}}

/* ===== OVERLAY & PANEL ===== */
#ov{position:fixed;inset:0;background:rgba(30,15,40,.72);display:none;place-items:center;z-index:50;padding:12px}
#ov.on{display:grid}
.panel{display:none;width:min(94vw,640px);max-height:calc(var(--vh)*94);overflow:auto}
.panel.on{display:block;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink);padding:18px}
h2{font-size:14px;line-height:1.6;margin:0;text-align:center}
.btn{font-size:11px;padding:10px 14px;background:var(--accent);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:9px;padding:6px 10px;background:#fff;color:var(--ink)}
.btns{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.row{display:flex;gap:12px;margin-top:14px}
.row>*{flex:1;min-width:0}
.letter{background:#fff;border:3px solid var(--ink);padding:12px;font-size:10px;line-height:1.9;white-space:pre-line;max-height:calc(var(--vh)*42);overflow:auto}
.photo{border:3px solid var(--ink);background:#fff;align-self:flex-start}
.photo img{width:100%;display:block}
@media(max-width:520px){.row{flex-direction:column}}

/* phone */
.notif{background:#fff;border:3px solid var(--ink);padding:14px;display:flex;gap:12px;align-items:flex-start;font-size:11px;line-height:1.9;white-space:pre-line;animation:ring .5s}
.notif b{font-size:26px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}

/* bingkai foto */
.viewer{position:relative;width:100%;height:min(calc(var(--vh)*58),420px);margin:0 auto;background:#222;border:3px solid var(--ink);overflow:hidden;touch-action:none}
.viewer.zin{animation:zin 1s ease-out}
@keyframes zin{from{transform:scale(.15);opacity:0}to{transform:none;opacity:1}}
.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 50%;user-select:none;-webkit-user-drag:none}
.tools{display:flex;gap:6px;flex-wrap:wrap}

/* turntable */
.songs{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.songs button{width:100%;text-align:left;font-size:10px;line-height:1.7;padding:10px 12px;background:#fff;border:3px solid var(--ink);cursor:pointer}
.songs button:hover{background:var(--pink)}
.disc{display:block;text-align:center;font-size:30px;animation:spin 15s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* photobooth */
.panel.full{width:100vw;max-height:none;height:calc(var(--vh)*100);background:#111;position:relative}
#cam{position:absolute;inset:0 0 70px 0;display:grid;place-items:center}
#cam video,#cam img{max-width:100%;max-height:100%}
#cam video.mirror{transform:scaleX(-1)}
#count{position:absolute;inset:0 0 70px 0;display:grid;place-items:center;color:#fff;font-size:min(30vw,160px);text-shadow:4px 4px 0 var(--ink);pointer-events:none}
#bmsg{position:absolute;top:12px;left:0;right:0;text-align:center;color:#fff;font-size:10px;line-height:1.8;padding:0 12px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .35s}@keyframes fl{from{opacity:.9}to{opacity:0}}
.bar{position:absolute;left:0;right:0;bottom:0;height:70px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px}
.bar .r{justify-self:end}

/* start */
#start{position:fixed;inset:0;z-index:100;background:var(--pink);display:grid;place-items:center;text-align:center;cursor:pointer;padding:20px}
#start h1{font-size:clamp(16px,4vw,28px);line-height:1.2;margin:0}
#start h2{line-height:1.2}
#start p{font-size:11px;margin:12px 0 0;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*:not(.disc):not(.bal):not(#start p){animation-duration:.01s!important}}

  /* ===== CSS MAKE A WISH DI SINI ===== */
  .wish-box textarea {
    width: 100%;
    height: 90px;
    background: #fff;
    border: 3px solid var(--ink);
    padding: 10px;
    font-family: inherit;
    font-size: 9px;
    resize: none;
    outline: none;
    margin-top: 10px;
    color: var(--ink);
  }
  .wish-box textarea::placeholder {
    color: #a89bb6;
  }
  #p-wish .card {
    text-align: left;
  }
  #v-overlay {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--pink);
    display: none;
    place-items: center;
    z-index: 1000;
    flex-direction: column;
    padding: 24px;
  }
  #v-overlay.on {
    display: flex;
  }
  #v-overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    background: #fff36a;
    opacity: 0;
    pointer-events: none;
  }
  #v-overlay.flash::before {
    animation: wish-flash .7s ease-out forwards;
  }
  @keyframes wish-flash {
    0%{opacity:0}
    25%{opacity:1}
    100%{opacity:0}
  }
  #v-overlay h2,
  #v-overlay video,
  #v-overlay #wish-save-feedback,
  #v-overlay #wish-finish {
    position: absolute;
  }
  #v-overlay video {
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  #v-overlay.flash video,
  #v-overlay.revealed video {
    opacity: 0;
    transition: opacity .2s ease-out;
  }
  #v-overlay h2 {
    top: 50%;
    left: 50%;
    z-index: 1;
    color: #fff;
    font-size: clamp(14px, 2.4vw, 24px);
    text-align: center;
    line-height: 1.8;
    font-family: 'Press Start 2P', monospace;
    opacity: 0;
    transform: translate(-50%, -50%) scale(2.5);
    text-shadow: 3px 3px 0 var(--ink);
  }
  #v-overlay.revealed h2 {
    animation: wish-zoom-out 1.1s cubic-bezier(.16,.8,.3,1) forwards;
  }
  @keyframes wish-zoom-out {
    to{opacity:1;transform:translate(-50%, -50%) scale(1)}
  }
  #p-wish .card{width:min(94vw,560px);padding:22px}
  #p-wish h2{margin-bottom:18px}
  #wish-form{display:flex;flex-direction:column;gap:10px}
  #wish-form label{font-size:10px;line-height:1.6}
  #wish-form textarea{display:block;width:100%;height:130px;background:#fff;border:3px solid var(--ink);padding:12px;
    font:10px/1.8 'Press Start 2P',monospace;resize:vertical;color:var(--ink)}
  #wish-form textarea::placeholder{color:#a89bb6}
  #wish-status{min-height:1.8em;margin:0;font-size:9px;line-height:1.8}
  #wish-form .btns{margin-top:4px}
  #v-overlay #wish-finish{display:none;z-index:3;bottom:8vh;margin:0}
  #v-overlay.show-continue #wish-finish{display:block}
  #wish-save-feedback{z-index:3;bottom:17vh;max-width:min(90vw,760px);margin:0;color:#fff;font-size:9px;line-height:1.8;text-align:center;text-shadow:1px 1px 2px var(--ink)}

</style>
</head>
<body>

<div id="start"><div><h1>KNOCK KNOCK</h1><h2>Who's There?</h2><p>Tap for a surprise!</p></div></div>

<div id="rotate"><div><span>📱</span><p>Round your phone to landscape mode<br>to see the surprise</p></div></div>

<!-- ===== RUANGAN ===== -->
<div id="stage">
  <div class="obj" data-key="frame"     id="o-frame"  style="left:1%;top:19%;width:10%;height:20%"><span class="ph">🖼️</span><i class="lbl">frame</i></div>
  <div class="obj frame-right" id="o-frame-right" aria-label="Bingkai foto kanan" role="button" tabindex="0"
       style="left:88%;top:18%;width:11%;height:21%"></div>
  <div class="obj" data-key="booth"     id="o-booth"  style="left:79%;top:35%;width:13%;height:38%"><span class="ph">📷</span><i class="lbl">photobooth</i></div>
  <div class="obj" data-key="phone"     id="o-phone"  style="left:55%;top:58%;width:6%;height:7%"><span class="ph">📱</span><i class="lbl">phone</i></div>
  <div class="obj" data-key="turntable" id="o-table"  style="left:7%;top:38%;width:11%;height:34%"><span class="ph">💿</span><i class="lbl">turntable</i></div>
  <div class="obj" id="cake" style="left:44%;top:47%;width:11%;height:20%">
    <div class="candle"><b class="flame"></b></div><div class="tier t1"></div><div class="tier t2"></div>
  </div>
  <div class="obj wish-trigger" data-key="wish" id="o-wish" aria-label="One Wish Willow" role="button" tabindex="0"
       style="left:38%;top:48%;width:6%;height:26%"><span class="ph">🎟️</span></div>
  <!-- Area klik lima kado yang sudah terlihat pada gambar latar -->
  <div class="obj gift" data-key="gift" style="left:4%;top:77%;width:7%;height:14%"><span class="ph">🎁</span></div>
  <div class="obj gift" data-key="gift" style="left:10%;top:77%;width:7%;height:14%"><span class="ph">🎁</span></div>
  <div class="obj gift" data-key="gift" style="left:82%;top:77%;width:7%;height:14%"><span class="ph">🎁</span></div>
  <div class="obj gift" data-key="gift" style="left:88%;top:77%;width:7%;height:14%"><span class="ph">🎁</span></div>
  <div class="obj gift purple" data-key="gift" style="left:94%;top:77%;width:6%;height:14%"><span class="ph">🎁</span></div>
  <!-- Area klik lima balon yang sudah terlihat pada gambar latar -->
  <div class="obj balloon" style="left:17%;top:21%;width:6%;height:23%;--c:#ff5c8a;--d:-.2s"><div class="bal"><i class="body"></i><i class="str"></i></div></div>
  <div class="obj balloon" style="left:23%;top:38%;width:6%;height:21%;--c:#ffc93c;--d:-.9s"><div class="bal"><i class="body"></i><i class="str"></i></div></div>
  <div class="obj balloon" style="left:26%;top:23%;width:6%;height:23%;--c:#f35ca7;--d:-1.5s"><div class="bal"><i class="body"></i><i class="str"></i></div></div>
  <div class="obj balloon" style="left:66%;top:34%;width:6%;height:23%;--c:#7bd957;--d:-.5s"><div class="bal"><i class="body"></i><i class="str"></i></div></div>
  <div class="obj balloon" style="left:70%;top:23%;width:6%;height:23%;--c:#b388ff;--d:-1.2s"><div class="bal"><i class="body"></i><i class="str"></i></div></div>
</div>

<!-- ===== OVERLAY ===== -->
<div id="ov">

  <!-- 1. kotak kado -->
  <section class="panel" id="p-gift"><div class="card">
    <h2 id="g-title"></h2>
    <div style="text-align:center;margin-top:10px"><button class="btn sm" data-close>close</button></div>
    <div class="row"><div class="letter" id="g-letter"></div><div class="photo"><img id="g-photo" alt=""></div></div>
  </div></section>

  <!-- 3. phone -->
  <section class="panel" id="p-phone"><div class="card">
    <div class="notif"><b>📱</b><span id="ph-text"></span></div>
    <div class="btns"><button class="btn" id="b-call">call</button><button class="btn" data-close>back</button></div>
  </div></section>

  <!-- 4. bingkai foto -->
  <section class="panel" id="p-frame"><div class="card">
    <h2 id="f-title">Bingkai Foto</h2>
    <div class="viewer" id="viewer"><img id="f-img" alt="" draggable="false"></div>
    <div class="btns">
      <div class="tools">
        <button class="btn sm" id="f-out">-</button><button class="btn sm" id="f-in">+</button>
      </div>
      <button class="btn" data-close>back</button>
    </div>
  </div></section>

  <!-- 5. photobooth -->
  <section class="panel full" id="p-booth">
    <div id="bmsg"></div>
    <div id="cam"><video id="vid" autoplay playsinline muted></video><img id="result" hidden alt="Hasil photobooth"></div>
    <div id="count"></div><div id="flash"></div>
    <div class="bar">
      <div><button class="btn" id="b-start">start</button></div>
      <button class="btn" id="b-dl" disabled>download</button>
      <div class="r"><button class="btn" data-close>back</button></div>
    </div>
  </section>

  <!-- 6. turntable -->
  <section class="panel" id="p-table"><div class="card">
    <span class="disc">💿</span><h2>Pilih lagu</h2>
    <ul class="songs" id="songs"></ul>
    <div class="btns" style="justify-content:flex-end"><button class="btn" data-close>back</button></div>
  </div></section>

  <section class="panel" id="p-wish"><div class="card">
    <h2>Make A Wish</h2>
    <form id="wish-form">
      <label for="wish-text" class="lbl">
      <textarea id="wish-text" name="wish" maxlength="500" placeholder="Write your wish..." required></textarea>
      <p id="wish-status" role="status" aria-live="polite"></p>
      <div class="btns">
        <button class="btn sm" type="button" data-close>back</button>
        <button class="btn" id="wish-submit" type="submit">Break it</button>
      </div>
    </form>
  </div></section>

</div>

<div id="v-overlay" role="dialog" aria-modal="true" aria-labelledby="wish-result-title">
  <h2 id="wish-result-title">Your Wish Will Come True</h2>
  <video id="wish-break-video" playsinline preload="auto"></video>
  <p id="wish-save-feedback" role="status" aria-live="polite"></p>
  <button class="btn" id="wish-finish">Continue</button>
</div>

<script>

  // nomor WhatsApp: format internasional tanpa + dan tanpa 0 di depan

  // teks di telepon
phoneText: `Hewwoo!
\nHappy Birthday Bisan. Sebelumnya cicik minta maaf ya kalau tulisan ini agak berantakan. Cicik mau tau dong apa aja wishlist Bisan yang belum kecentang sebelum menginjak kepala dua (?), semoga semua yang belum tercentang itu bisa hijau sebelum new year yah. Cicik harap semua yang Bisan mau jalanin setelah umur 20 ini bisa Bisan tempuh dengan mudah, semua tantangan ada solusinya, semua rintangan ada yang nemenin, semua jalan buntu bisa ada titik terangnya, perjuangan Bisan lancar diiringi doa-doa orang baik di sekitar Bisan maupun yang ngga deket Bisan saat ini.

function makeDraggable(el, onClick) {
  let startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = false, dragging = false;
  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = el.offsetLeft;
    startTop = el.offsetTop;
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && Math.abs(dx) + Math.abs(dy) > 6) {
      moved = true;
      el.classList.add('drag');
    }
    if (!moved) return;
    const stage = $('#stage');
    const x = clamp(startLeft + dx, 0, stage.clientWidth - el.offsetWidth);
    const y = clamp(startTop + dy, 0, stage.clientHeight - el.offsetHeight);
    el.style.left = `${x / stage.clientWidth * 100}%`;
    el.style.top = `${y / stage.clientHeight * 100}%`;
  });
  const finishDrag = () => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('drag');
    if (!moved) onClick();
  };
  el.addEventListener('pointerup', finishDrag);
  el.addEventListener('pointercancel', () => {
    dragging = false;
    el.classList.remove('drag');
  });
}

    const xInFrame = (slot.x - sourceFrame.x) * W / sourceFrame.width;
    const yInFrame = (slot.y - sourceFrame.y) * H / sourceFrame.height;
    const slotWidth = slot.width * W / sourceFrame.width;
    const slotHeight = slot.height * H / sourceFrame.height;

      shots[i],
      photoX, photoY, photoWidth, photoHeight

  $('#wish-submit').disabled = false;
  show('wish');
  setTimeout(() => wishText.focus(), 0);
}
$('#o-wish').addEventListener('click', openWish);
$('#o-wish').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openWish(); }
});
function closeWishResult() {
  clearTimeout(wishRevealTimer);
  wishVideo.pause();
  wishVideo.currentTime = 0;
  wishOverlay.classList.remove('on', 'playing', 'flash', 'revealed', 'show-continue');
}
$('#wish-finish').addEventListener('click', () => { closeWishResult(); closeAll(); });
function revealWishMessage() {
  if (!wishOverlay.classList.contains('on') ||
      wishOverlay.classList.contains('flash') ||
      wishOverlay.classList.contains('revealed')) return;
  wishOverlay.classList.remove('playing');
  wishOverlay.classList.add('flash');
  wishRevealTimer = setTimeout(() => {
    wishOverlay.classList.remove('flash');
    wishOverlay.classList.add('revealed');
    wishRevealTimer = setTimeout(() => {
      wishOverlay.classList.add('show-continue');
      $('#wish-finish').focus();
    }, 1150);
  }, 700);
}
wishVideo.addEventListener('ended', revealWishMessage);
wishForm.addEventListener('submit', async e => {
  e.preventDefault();
  const wish = wishText.value.trim();
  if (!wish) {
    wishStatus.textContent = 'Please write your wish first.';
    wishText.focus();
    return;
  }
  if (wish.length > 500) {
    wishStatus.textContent = 'Please keep your wish under 500 characters.';
    return;
  }
  const submit = $('#wish-submit');
  submit.disabled = true;
  $('#wish-save-feedback').textContent = '';
  clearTimeout(wishRevealTimer);
  wishOverlay.classList.remove('flash', 'revealed', 'show-continue');
  wishOverlay.classList.add('on', 'playing');
  wishVideo.currentTime = 0;
  try {
    await wishVideo.play();
  } catch (error) {
    console.error('Could not play the wish animation:', error);
    $('#wish-save-feedback').textContent = 'Could not play the animation. Check that sfx/wood_break_3s.mp4 exists and can be played.';
    revealWishMessage();
  }

  if (CONFIG.supabaseUrl.includes('YOUR_PROJECT_ID') || CONFIG.supabaseAnonKey === 'YOUR_SUPABASE_ANON_KEY') {
    $('#wish-save-feedback').textContent = 'Animation playing. This wish was not saved because the database is not configured yet.';
    return;
  }

  $('#wish-save-feedback').textContent = 'Saving your wish...';
  try {
    const response = await fetch(`${CONFIG.supabaseUrl.replace(/\/$/, '')}/rest/v1/wishes`, {
      method: 'POST',
      headers: {
        'apikey': CONFIG.supabaseAnonKey,
        'Authorization': `Bearer ${CONFIG.supabaseAnonKey}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ wish })
    });
    if (!response.ok) {
      const detail = await response.text();
      throw new Error(`Database returned ${response.status}: ${detail}`);
    }
    $('#wish-save-feedback').textContent = 'Your wish was saved.';
  } catch (error) {
    console.error('Could not save the wish:', error);
    $('#wish-save-feedback').textContent = 'Animation playing, but the wish could not be saved. Check your database connection and try again later.';
  }
});
</script>
</body>
</html>
